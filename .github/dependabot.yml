version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      objc2:
        patterns:
          - "objc2*"
          - "block2"
          - "dispatch2"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
